<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đồng hồ bấm giờ</title>
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bấm giờ">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff;--tx:#222;--chip:#eee;--mu:#888;--bd:#e5e5e5}
[data-theme=dark]{--bg:#14161a;--tx:#eee;--chip:#2a2d33;--mu:#9aa;--bd:#33363c}
body{margin:0;font-family:-apple-system,"SF Pro Display",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:480px;min-height:100vh;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--bg)}
.top{position:relative;height:52vh;height:52dvh;min-height:340px;color:#fff;text-align:center;background:linear-gradient(135deg,#ff6b57,#f4364f 55%,#ee1650);transition:background .4s}
.top.rest{background:linear-gradient(135deg,#2dd4bf,#0ea5e9)}
.top.setrest{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.top.switch{background:linear-gradient(135deg,#fbbf24,#f97316)}
h1{margin:0;padding:calc(env(safe-area-inset-top,0px) + 22px) 60px 0;font-size:24px;font-weight:700}
#menu{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:22px;cursor:pointer}
#label{margin-top:34px;font-size:18px;opacity:.9;min-height:24px}
#time{font-size:80px;font-size:clamp(72px,24vw,96px);font-weight:700;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
#info{font-size:16px;opacity:.9;margin-top:6px;min-height:22px}
#prog{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.7);width:0;transition:width .2s}
.sheet{flex:1;background:var(--bg);border-radius:34px 34px 0 0;margin-top:-34px;position:relative;padding:62px 16px calc(30px + env(safe-area-inset-bottom,0px))}
#play{position:absolute;top:-45px;left:50%;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:7px solid #f2284f;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 12px var(--bg);padding:0}
#play svg{width:38px;height:38px;fill:#f2284f}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tools button{border:0;background:var(--chip);border-radius:14px;padding:8px 4px;min-height:52px;font-size:13.5px;font-weight:600;line-height:1.25;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tools small{display:block;font-size:11.5px;font-weight:400;color:var(--mu);margin-top:1px}
.row{display:flex;align-items:center;border-radius:20px;padding:8px 12px 8px 16px;min-height:68px;margin-bottom:10px;font-size:18px;font-weight:600}
.row .ic{width:28px;height:28px;margin-right:12px;flex:none}
.row .n{flex:1;min-width:0;cursor:pointer;color:var(--tx);line-height:1.2}
.row .n small{display:block;font-size:12px;font-weight:400;line-height:1.25;color:var(--mu);margin-top:2px}
.row .v{font-size:26px;font-weight:600;min-width:62px;text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.row button{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.8);font-size:22px;font-weight:700;margin-left:2px;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.r1{background:#e6f9f0;color:#15803d}.r2{background:#fde1e6;color:#d81b45}
.r3{background:#f3f3f3;color:#5f5f5f}.r4{background:#e8eafd;color:#4350d8}
.r5{background:#f1e9fc;color:#7c3aed}.r6{background:#fdf6e3;color:#a16207}
[data-theme=dark] .r1{background:#12301f}[data-theme=dark] .r2{background:#3a1520}[data-theme=dark] .r3{background:#2a2a2a}
[data-theme=dark] .r4{background:#1b1f45}[data-theme=dark] .r5{background:#2a1c47}[data-theme=dark] .r6{background:#3a3115}
[data-theme=dark] .row button{background:rgba(255,255,255,.15)}
[data-theme=dark] .r1{color:#4ade80}[data-theme=dark] .r2{color:#ff7b95}[data-theme=dark] .r3{color:#c4c4c4}
[data-theme=dark] .r4{color:#9aa5ff}[data-theme=dark] .r5{color:#b9a0ff}[data-theme=dark] .r6{color:#f0cc55}
#run{display:none;position:fixed;inset:0;z-index:9;flex-direction:column;align-items:center;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto;transition:background .4s}
#rTitle{font-size:24px;font-weight:700;margin-bottom:clamp(8px,2.4dvh,22px)}
.pan{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;border:2px solid rgba(255,255,255,.25);border-radius:26px;padding:0 20px;height:78px;height:clamp(52px,8dvh,78px);flex:none;margin-bottom:10px;font-size:20px;font-weight:600}
.dots{display:flex;gap:10px}.dots i{width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.15)}.dots i.on{background:#fff}
.ringw{position:relative;flex:none;width:min(80vw,380px);width:clamp(180px,min(80vw,380px,calc(100dvh - 530px)),380px);aspect-ratio:1;margin:auto;container-type:inline-size}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#rPhase{font-size:22px;font-weight:600;text-transform:uppercase}
#rTime{font-size:64px;font-size:clamp(44px,22cqw,84px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#rTotal{font-size:24px;font-weight:600;display:flex;align-items:center;gap:8px}
#rName{font-size:30px;font-size:clamp(26px,4.6dvh,38px);font-weight:800;text-transform:uppercase;text-align:center;overflow-wrap:anywhere;padding:0 8px}
#rSub{opacity:.85;margin:6px 0 clamp(10px,2.6dvh,24px);min-height:20px;text-align:center}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px}
.ctl .c{background:none;border:0;color:#fff;font-size:18px;width:70px;cursor:pointer;text-align:left}
#rPlay{width:104px;height:104px;width:clamp(84px,13dvh,116px);height:clamp(84px,13dvh,116px);border-radius:50%;border:0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#rPlay svg{width:46px;height:46px;fill:currentColor}
#rSkip{width:70px;height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.25);cursor:pointer;display:flex;align-items:center;justify-content:center}
/* Popup / menu */
.ov{display:none;overscroll-behavior:contain;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
.box{background:var(--bg);color:var(--tx);width:100%;max-width:480px;height:84vh;height:84dvh;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 20px);border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .24s ease-out}
.box::before{content:"";flex:none;width:40px;height:5px;border-radius:3px;background:var(--bd);margin:9px auto 0}
.box.sm{height:auto}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
.mh{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 18px 10px;font-size:22px;font-weight:700}
.mh button{border:0;background:var(--chip);color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer}
.tabs{flex:none;display:flex;flex-wrap:nowrap;gap:4px;padding:0 12px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs .tb{flex:1 0 auto;text-align:center;padding:10px 7px;font-size:13.5px;font-weight:600}
.tb,.btn{border:0;background:var(--chip);color:var(--tx);border-radius:12px;padding:9px 13px;min-height:38px;font-size:14px;cursor:pointer;white-space:nowrap}
.tb.on,.btn.p{background:#f2284f;color:#fff}
.btn{margin:6px 6px 0 0}
#mb{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 18px 22px;font-size:15px;line-height:1.55}
html.lock,html.lock body{overflow:hidden}
#mb a{color:#f2284f;font-weight:600;text-decoration:none}#mb p{margin:10px 0}#mb ul{padding-left:20px;margin:6px 0}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px}
.st div{background:var(--chip);border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;color:var(--mu)}
.st b{display:block;font-size:19px;color:var(--tx)}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:600}
.nav .btn{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal i{font-style:normal;color:var(--mu);font-size:11px}
.cal b{font-weight:500;padding:9px 0;border-radius:10px;cursor:pointer;background:var(--chip)}
.cal b.n{visibility:hidden}.cal b.t{outline:2px solid #f2284f}
.yr{display:flex;align-items:flex-end;gap:5px;height:160px;margin:8px 0}
.yr div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu);cursor:pointer}
.yr span{width:100%;background:#f2284f;border-radius:6px 6px 0 0;min-height:2px}
.it{border:1px solid var(--bd);border-radius:14px;padding:11px 14px;margin:10px 0}
.it small{display:block;color:var(--mu)}
.it b{font-size:16px}
.ill{display:block;width:100%;max-height:130px;margin:6px 0;color:var(--tx)}
img.ill{max-height:none;height:auto;border-radius:12px}
</style>
</head>
<body>
<div id="app">
<div class="top" id="top">
<h1>Đồng hồ bấm giờ</h1>
<button id="menu" aria-label="Trình đơn">☰</button>
<div id="label">Tổng thời gian</div>
<div id="time">00:00</div>
<div id="info"></div>
<div id="prog"></div>
</div>
<div class="sheet" id="sheet">
<button id="play" aria-label="Bắt đầu"><svg viewBox="0 0 24 24" id="pi"><path d="M7 4l14 8-14 8z"/></svg></button>
<div class="tools">
<button id="voice">🔊 Âm thanh</button><button id="theme">🌓 Giao diện</button><button id="names">✏️ Tên bài<small>Tùy chỉnh</small></button>
</div>
<div id="rows"></div>
</div>
</div>
<div id="run">
<div id="rTitle">Tập luyện</div>
<div class="pan">Bài tập<div class="dots" id="rEx"></div></div>
<div class="pan">Vòng tập<div class="dots" id="rSet"></div></div>
<div class="ringw">
<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="3"/>
<circle id="ring" cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="0"/></svg>
<div class="mid"><div id="rPhase"></div><div id="rTime">00:00</div>
<div id="rTotal"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="15" cy="15" r="12"/><path d="M15 8v8h5"/></svg><span id="rLeft">00:00</span></div></div>
</div>
<div id="rName"></div><div id="rSub"></div>
<div class="ctl"><button class="c" id="rCancel">HỦY</button>
<button id="rPlay"><svg viewBox="0 0 24 24" id="rpi"><path d="M7 4l14 8-14 8z"/></svg></button>
<button id="rSkip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"/><path d="M19 5v14"/></svg></button></div>
</div>
<div class="ov" id="ov"><div class="box">
<div class="mh"><span id="mtl"></span><button data-a="close" aria-label="Đóng">✕</button></div>
<div class="tabs" id="mt"></div><div id="mb"></div>
</div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const $=id=>document.getElementById(id);
const DEF={prep:5,hold:10,rest:3,ex:3,nSets:3,first:5,dec:2,setRest:15,switchRest:30,swap:1,sideRest:10,snd:'beep',theme:'auto',names:['Curl-Up','Side Plank','Bird-Dog']};
let cfg={...DEF};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cfg')||'{}'))}catch(e){}
const getSets=(c=cfg)=>Array.from({length:c.nSets},(_,i)=>Math.max(1,c.first-c.dec*i));
const save=()=>{try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const p2=n=>String(n).padStart(2,'0');
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BIG3=['Curl-Up','Side Plank','Bird-Dog'];
const nameOf=e=>((cfg.names||[])[e-1]||'').trim()||BIG3[e-1]||'Bài tập '+e;
const ICONS={
play:'<svg class="ic" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="15" cy="15" r="12"/><path d="M12 10l8 5-8 5z" fill="currentColor"/></svg>',
pause:'<svg class="ic" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="15" cy="15" r="12"/><path d="M12 10v10M18 10v10"/></svg>',
bolt:'<svg class="ic" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="15" cy="15" r="12"/><path d="M16 7l-5 9h4l-1 7 5-9h-4z" fill="currentColor"/></svg>',
loop:'<svg class="ic" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M24 15a9 9 0 1 1-3-6.7M24 5v5h-5"/></svg>',
clock:'<svg class="ic" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="15" cy="15" r="12"/><path d="M15 8v8h5"/></svg>'
};
const ROWS=[
{k:'prep',cls:'r6',ic:'clock',name:'Chuẩn bị',sub:'Giây trước khi bắt đầu (0 = tắt)',step:1,min:0,fmt:fmt},
{k:'hold',cls:'r1',ic:'play',name:'Tập luyện',sub:'Giữ mỗi cái (giây)',step:1,min:1,fmt:fmt},
{k:'rest',cls:'r2',ic:'pause',name:'Nghỉ ngơi',sub:'Nghỉ giữa các cái (giây)',step:1,min:0,fmt:fmt},
{k:'ex',cls:'r3',ic:'bolt',name:'Bài tập',sub:'Số bài',step:1,min:1,fmt:v=>v},
{k:'swap',cls:'r5',ic:'loop',name:'Đổi chân / đổi bên',sub:'Bật: mỗi bài làm bên trái rồi bên phải',step:1,min:0,max:1,fmt:v=>v?'Bật':'Tắt'},
{k:'nSets',cls:'r4',ic:'loop',name:'Số hiệp',sub:'Số hiệp mỗi bài',step:1,min:1,fmt:v=>v},
{k:'first',cls:'r4',ic:'loop',name:'Số cái ở hiệp đầu',sub:'Hiệp đầu tiên có bao nhiêu cái',step:1,min:1,fmt:v=>v},
{k:'dec',cls:'r4',ic:'loop',name:'Giảm mỗi hiệp',sub:'0 = giữ nguyên các hiệp',step:1,min:0,fmt:v=>v},
{k:'setRest',cls:'r5',ic:'clock',name:'Nghỉ giữa hiệp',sub:'Giây',step:1,min:0,fmt:fmt},
{k:'sideRest',cls:'r5',ic:'clock',name:'Nghỉ đổi bên',sub:'Giây',step:1,min:0,fmt:fmt},
{k:'switchRest',cls:'r6',ic:'clock',name:'Nghỉ chuyển bài',sub:'Giây',step:1,min:0,fmt:fmt}
];
const SND=[['beep','Âm báo'],['voice','Giọng nói'],['both','Âm báo + giọng nói'],['off','Tắt']];
const SNDS={beep:'Âm báo',voice:'Giọng nói',both:'Báo + nói',off:'Tắt'};
const THM=[['auto','Tự động'],['light','Sáng'],['dark','Tối']];
function applyTheme(){const d=cfg.theme==='dark'||(cfg.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}
function render(){
$('rows').innerHTML=ROWS.map(r=>{
const v=cfg[r.k];
return `<div class="row ${r.cls}">${ICONS[r.ic]}<div class="n" data-k="${r.k}">${r.name}<small>${r.sub}</small></div>`+
`<button data-k="${r.k}" data-d="-1">−</button><div class="v" data-k="${r.k}">${r.fmt(v)}</div><button data-k="${r.k}" data-d="1">+</button></div>`;
}).join('');
$('voice').innerHTML='🔊 Âm thanh<small>'+SNDS[cfg.snd]+'</small>';
$('theme').innerHTML='🌓 Giao diện<small>'+THM.find(x=>x[0]===cfg.theme)[1]+'</small>';
applyTheme();
if(!running&&!started)showTotal();
}
$('rows').addEventListener('click',e=>{
if(started)return;
const k=e.target.dataset.k;if(!k)return;
const r=ROWS.find(x=>x.k===k);
if(e.target.dataset.d){
cfg[k]=Math.min(r.max||1e4,Math.max(r.min,cfg[k]+r.step*e.target.dataset.d));
save();render();return;
}
const s=prompt(r.name+' ('+r.sub+')',cfg[k]);
if(s!==null&&!isNaN(+s)){
cfg[k]=Math.min(r.max||1e4,Math.max(r.min,Math.round(+s)));
save();render();
}
});
$('voice').onclick=()=>{const i=SND.findIndex(x=>x[0]===cfg.snd);cfg.snd=SND[(i+1)%SND.length][0];if('speechSynthesis' in window)speechSynthesis.cancel();save();render()};
$('theme').onclick=()=>{const i=THM.findIndex(x=>x[0]===cfg.theme);cfg.theme=THM[(i+1)%3][0];save();render()};
$('names').onclick=()=>{const n=[...(cfg.names||[])];for(let i=1;i<=cfg.ex;i++){const s=prompt('Tên bài '+i+' (để trống = tên mặc định)',n[i-1]||nameOf(i));if(s===null)break;n[i-1]=s.trim()}cfg.names=n;save();render()};
/* Timeline */
function build(){
const st=[],S=getSets(),sides=cfg.swap?2:1;
if(cfg.prep>0)st.push({t:'prep',d:cfg.prep,e:1,s:1,label:'Chuẩn bị'});
for(let e=1;e<=cfg.ex;e++){
for(let sd=1;sd<=sides;sd++){
S.forEach((n,si)=>{
for(let r=1;r<=n;r++){
st.push({t:'hold',d:cfg.hold,e,s:si+1,r,n,sd,label:'Giữ'});
if(r<n&&cfg.rest>0)st.push({t:'rest',d:cfg.rest,e,s:si+1,r,n,sd,label:'Nghỉ'});
}
if(si<S.length-1&&cfg.setRest>0)st.push({t:'setrest',d:cfg.setRest,e,s:si+1,sd,label:'Nghỉ giữa hiệp',say:`Xong hiệp ${si+1}. Nghỉ ${cfg.setRest} giây. Hiệp tiếp theo ${S[si+1]} cái`});
});
if(sd<sides&&cfg.sideRest>0)st.push({t:'side',d:cfg.sideRest,e,sd,label:'Đổi bên',say:`Xong bên trái. Nghỉ ${cfg.sideRest} giây, đổi sang bên phải`});
}
if(e<cfg.ex&&cfg.switchRest>0)st.push({t:'switch',d:cfg.switchRest,e,label:'Chuyển bài',say:`Xong ${nameOf(e)}. Nghỉ ${cfg.switchRest} giây, chuyển sang ${nameOf(e+1)}`});
}
return st;
}
let sessStart=0,steps=[],idx=0,rem=0,running=false,started=false,last=0,lastSec=-1,totalAll=0,doneTime=0,halfSaid=false,wl=null;
const COL={prep:['#a78bfa','#7c3aed'],hold:['#5de3a1','#4ecb8f'],rest:['#ff6b57','#ee1650'],setrest:['#8b8bf5','#5b6cf0'],switch:['#fbbf24','#f97316'],side:['#fbbf24','#f97316']};
const TITLE={prep:'Chuẩn bị',hold:'Tập luyện',rest:'Nghỉ ngơi',setrest:'Nghỉ giữa hiệp',switch:'Chuyển bài',side:'Đổi bên'};
const SIDE=['','Bên trái','Bên phải'];
function showTotal(){
const tot=build().reduce((a,s)=>a+s.d,0);
$('time').textContent=fmt(tot);$('label').textContent='Tổng thời gian';
$('top').className='top';$('info').textContent=cfg.ex+' bài × '+cfg.nSets+' hiệp ('+getSets().join('·')+')'+(cfg.swap?' · 2 bên':'');
}
/* Âm thanh */
let ac=null;
function initAudio(){
try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(e){}
try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}
}
function beep(f=880,d=.15,v=.35){
if(!ac||!(cfg.snd==='beep'||cfg.snd==='both'))return;
const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
o.frequency.value=f;o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
o.start(t);o.stop(t+d+.02);
}
function say(t){
if(!(cfg.snd==='voice'||cfg.snd==='both')||!t||!('speechSynthesis' in window))return;
const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=1.05;
const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('vi'));if(v)u.voice=v;
speechSynthesis.cancel();speechSynthesis.speak(u);
}
function cueStart(s){
if(s.t==='hold'){beep(1000,.35);say('Bắt đầu')}
else if(s.t==='prep'){beep(600,.15);say('Chuẩn bị')}
else if(s.t==='rest'){beep(500,.25);say('Nghỉ')}
else{beep(500,.25);say(s.say)}
}
const dots=(el,n,c)=>{el.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<c?'on':''}"></i>`).join('')};
function enter(i){
idx=i;const s=steps[i];rem=s.d;lastSec=-1;halfSaid=false;
const c=COL[s.t];
$('run').style.background=`linear-gradient(135deg,${c[0]},${c[1]})`;$('rPlay').style.color=c[1];
$('rTitle').textContent=TITLE[s.t];$('rPhase').textContent=TITLE[s.t];
const ex=s.t==='switch'?s.e+1:s.e,st=s.t==='switch'||s.t==='side'?1:s.t==='setrest'?s.s+1:s.s,sl=cfg.swap&&s.sd?' · '+SIDE[s.sd]:'';
const S=getSets();
dots($('rEx'),cfg.ex,ex);dots($('rSet'),S.length,st);$('rName').textContent=nameOf(ex);
$('rSub').textContent=s.t==='prep'?'Sẵn sàng nào':s.t==='hold'?`Cái ${s.r}/${s.n}${sl}`:s.t==='rest'?`Cái tiếp theo: ${s.r+1}/${s.n}${sl}`:s.t==='side'?`Tiếp theo: ${SIDE[2].toLowerCase()}`:`Hiệp ${st}: ${S[st-1]} cái${sl}`;
upd();
cueStart(s);
}
function upd(){
const s=steps[idx],r=Math.max(rem,0);
$('rTime').textContent=fmt(r);
$('ring').style.strokeDashoffset=578.05*(1-r/s.d);$('rLeft').textContent=fmt(totalAll-doneTime-(s.d-r));
}
function tick(now){
if(!running)return;
rem-=(now-last)/1000;last=now;
const s=steps[idx],sec=Math.ceil(rem);
if(s.t==='hold'){
if(!halfSaid&&rem<=s.d/2){halfSaid=true;if(s.d>=4){beep(800,.1);say('Một nửa')}}
}else if(s.d>3&&sec!==lastSec&&sec>=1&&sec<=3){beep(700,.1);say(String(sec))}
lastSec=sec;
if(rem<=0){
doneTime+=s.d;
if(idx+1>=steps.length){finish();return}
enter(idx+1);
}else upd();
requestAnimationFrame(tick);
}
function setIcon(){$('rpi').innerHTML=running?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M7 4l14 8-14 8z"/>'}
async function wake(on){try{if(on){wl=await navigator.wakeLock.request('screen')}else if(wl){wl.release();wl=null}}catch(e){}}
function close(){running=false;started=false;wake(false);$('run').style.display='none';showTotal()}
/* Ghi lịch sử */
function logSess(ok){
const n=ok?steps.length:idx,dn=steps.slice(0,n).filter(s=>s.t==='hold'),h=dn.length;
const cur=steps[idx],el=ok?totalAll:doneTime+(cur.d-Math.max(rem,0));
if(!h)return;
const nl=Array.from({length:cfg.ex},(_,i)=>nameOf(i+1));
put('hist',[...get('hist'),{t:Date.now(),s0:sessStart,wt:Math.round((Date.now()-sessStart)/1000),el:Math.round(el),h,hd:cfg.hold,ex:cfg.ex,ns:cfg.nSets,ok:ok?1:0,nm:nl.join(', '),nl,ss:getSets(),sw:cfg.swap?1:0,h1:dn.filter(x=>x.sd===1).length,h2:dn.filter(x=>x.sd===2).length,pe:nl.map((_,i)=>dn.filter(x=>x.e===i+1).length),rt:{pr:cfg.prep,rs:cfg.rest,sr:cfg.setRest,sd:cfg.sideRest,sw:cfg.switchRest},sp:ok?null:{e:cur.e,s:cur.s,r:cur.r,sd:cur.sd}}]);
}
function finish(){running=false;logSess(true);beep(1000,.15);setTimeout(()=>beep(1000,.15),200);setTimeout(()=>beep(1300,.4),400);say('Hoàn thành buổi tập');close()}
$('play').onclick=()=>{
initAudio();
steps=build();if(!steps.length)return;
totalAll=steps.reduce((a,s)=>a+s.d,0);doneTime=0;started=true;running=true;sessStart=Date.now();
$('run').style.display='flex';last=performance.now();enter(0);setIcon();wake(true);
requestAnimationFrame(tick);
};
$('rPlay').onclick=()=>{
initAudio();
running=!running;setIcon();
if(running){last=performance.now();requestAnimationFrame(tick)}else if('speechSynthesis' in window)speechSynthesis.cancel();
};
$('rCancel').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();logSess(false);close()};$('rSkip').onclick=()=>{
doneTime+=steps[idx].d;
if(idx+1>=steps.length)finish();else enter(idx+1);
};

const vAbout=()=>`<p><b>Đồng hồ bấm giờ</b> (phiên bản 2.0) là ứng dụng bấm giờ tập luyện <b>McGill Big 3</b> (Curl-Up, Side Plank, Bird-Dog): chỉnh thời gian giữ, nghỉ, số bài, số hiệp và theo dõi quá trình tập mỗi ngày.</p><div class="it"><small>Tác giả</small><b>Hoàng Hùng</b></div><div class="it"><small>SĐT</small><a href="tel:0964843943">0964843943</a></div><div class="it"><small>Facebook</small><a href="https://fb.com/masterhmh" target="_blank" rel="noopener">fb.com/masterhmh</a></div>`;
const IMG={

};
const vEx=()=>`<p>McGill Big 3 gồm 3 bài, tương ứng Bài 1, 2, 3 trong ứng dụng. Mỗi lần giữ khoảng 10 giây, làm theo kiểu giảm dần số lần (ví dụ 5-3-1 hoặc 6-4-2), nghỉ ngắn giữa các lần và thường tập hằng ngày.</p>
<div class="it"><b>1. Curl-Up (gập bụng cải tiến)</b><img class="ill" src="curlup.gif" alt="Ảnh động Curl-Up" loading="lazy" onerror="this.outerHTML=IMG.curl"><ul><li>Nằm ngửa, một chân co, chân kia duỗi thẳng. Hai tay đặt dưới thắt lưng để giữ độ cong tự nhiên của lưng.</li><li>Nâng nhẹ đầu và vai lên chỉ vài xăng-ti-mét, giữ cổ và ngực thành một khối, mắt nhìn lên trần.</li><li>Giữ, thở đều rồi hạ xuống. Đổi chân co ở hiệp khác.</li><li>Lỗi hay gặp: cuộn lưng, kéo cổ bằng tay, nín thở, ép lưng xuống sàn.</li></ul></div>
<div class="it"><b>2. Side Plank (chống nghiêng)</b><img class="ill" src="sideplank.gif" alt="Ảnh động Side Plank" loading="lazy" onerror="this.outerHTML=IMG.side"><ul><li>Nằm nghiêng, khuỷu tay ngay dưới vai, cẳng tay vuông góc với thân.</li><li>Dễ hơn: đầu gối chạm sàn. Khó hơn: duỗi thẳng chân, hai chân chồng lên nhau.</li><li>Nâng hông khỏi sàn để thân thẳng một đường. Tay còn lại đặt trước ngực.</li><li>Làm cả hai bên. Lỗi hay gặp: hông võng, xoay người ra trước hoặc ra sau, nhún vai.</li></ul></div>
<div class="it"><b>3. Bird-Dog (chó săn chim)</b><img class="ill" src="birddog.gif" alt="Ảnh động Bird-Dog" loading="lazy" onerror="this.outerHTML=IMG.bird"><ul><li>Quỳ bốn điểm, tay dưới vai, gối dưới hông, lưng giữ trung tính.</li><li>Duỗi một chân ra sau ngang hông và tay đối diện ra trước ngang vai, cố giữ hông và vai không xoay.</li><li>Giữ, hạ về rồi đổi bên. Lỗi hay gặp: ưỡn lưng, nâng chân tay quá cao, xoay hông.</li></ul></div>
<p style="color:var(--mu);font-size:13px">Ảnh động minh họa từng bài: nâng lên, giữ, hạ xuống. Nét đỏ là phần cần chú ý (tay dưới lưng, hông nâng cao, tay và chân duỗi).</p><p>Mẹo trong ứng dụng: cả 3 bài đều nên làm hai bên (Curl-Up thì đổi chân co). Bật “Đổi chân / đổi bên” để ứng dụng tự chạy bên trái rồi bên phải cho mỗi bài. Đặt tên bài tại nút “✏️ Tên bài”.</p>
<p style="color:var(--mu);font-size:13px">Thông tin chỉ mang tính tham khảo, không thay thế tư vấn y tế. Nếu đang đau lưng nặng, tê hoặc yếu chân, hãy hỏi bác sĩ hoặc chuyên gia vật lý trị liệu trước khi tập.</p>`;
const vGuide=()=>`<p><b>Cách dùng ứng dụng</b></p><ul><li>Bấm + / − để đổi thông số, bấm vào số để nhập trực tiếp.</li><li>Bấm nút tròn lớn để bắt đầu; trong lúc tập có thể tạm dừng hoặc bỏ qua bước.</li><li>“Tên bài” để đặt tên từng bài; “Mẫu tập” để lưu và dùng lại cấu hình giờ.</li><li>“Đổi chân / đổi bên”: bật thì mỗi bài chạy bên trái, nghỉ đổi bên rồi chạy bên phải; tắt thì chỉ chạy một bên.</li><li>Buổi tập tự ghi vào Lịch sử khi hoàn thành (hoặc khi hủy giữa chừng nếu đã giữ ít nhất 1 cái).</li></ul><p><b>Nguyên tắc tập luyện</b></p><ul><li>Khởi động 3–5 phút trước khi tập.</li><li>Giữ đúng tư thế, thở đều, không nín thở.</li><li>Tăng dần: thêm vài giây giữ hoặc thêm hiệp mỗi tuần, không tăng đột ngột.</li><li>Nghỉ đủ giữa các hiệp; ngủ đủ để cơ hồi phục.</li><li>Tập đều đặn quan trọng hơn tập quá sức; dùng chuỗi ngày liên tiếp để giữ nhịp.</li><li>Đau nhói, chóng mặt hoặc khó thở: dừng ngay. Nếu có bệnh lý, hỏi bác sĩ trước khi tập.</li></ul>`;

function vHist(){
const h=get('hist'),days={};h.forEach(x=>{const k=dk(x.t);days[k]=(days[k]||0)+x.el});
let s=0,d=new Date();if(!days[dk(d)])d.setDate(d.getDate()-1);
while(days[dk(d)]){s++;d.setDate(d.getDate()-1)}
const keys=Object.keys(days).sort();let lg=0,run=0,pv=null;
keys.forEach(k=>{const q=k.split('-'),n=Date.UTC(+q[0],+q[1]-1,+q[2])/864e5;run=pv!==null&&n-pv===1?run+1:1;pv=n;lg=Math.max(lg,run)});
const inM=(x,p)=>dk(x.t).startsWith(p),sum=l=>l.reduce((a,x)=>a+x.el,0);
const best=h.reduce((a,x)=>Math.max(a,x.h?x.hd:0),0);
let o=`<div class="st"><div><b>${s}</b>ngày liên tiếp</div><div><b>${Math.max(lg,s)}</b>chuỗi dài nhất</div><div><b>${keys.length}</b>ngày đã tập</div><div><b>${Math.round(sum(h.filter(x=>inM(x,dk(Date.now()).slice(0,7))))/60)}</b>phút tháng này</div><div><b>${best} giây</b>giữ lâu nhất</div><div><b>${h.length}</b>buổi tập</div></div>`;
o+=[['day','Ngày'],['month','Tháng'],['year','Năm']].map(([k,n])=>`<button class="tb${k===hv?' on':''}" data-a="hv" data-v="${k}" style="margin-right:6px">${n}</button>`).join('');
const nav=t=>`<div class="nav"><button class="btn" data-a="nav" data-n="-1">◀</button>${t}<button class="btn" data-a="nav" data-n="1">▶</button></div>`;
if(hv==='day'){
const l=h.filter(x=>dk(x.t)===hdk).sort((a,b)=>a.t-b.t),[y,m,dd]=hdk.split('-');
o+=nav(`${dd}/${m}/${y}`);
o+=l.length?l.map(card).join('')+`<p>Tổng: ${l.length} buổi · ${fmt(sum(l))}</p>`:'<p>Chưa có buổi tập nào trong ngày này.</p>';
}else if(hv==='month'){
const pre=hy+'-'+p2(hm+1),dim=new Date(hy,hm+1,0).getDate(),off=(new Date(hy,hm,1).getDay()+6)%7,td=dk(Date.now());
let c=['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<i>${x}</i>`).join('')+'<b class="n"></b>'.repeat(off);
for(let i=1;i<=dim;i++){const k=pre+'-'+p2(i),mn=(days[k]||0)/60,a=Math.min(.95,.25+mn/40);
c+=`<b data-a="day" data-d="${k}" class="${k===td?'t':''}"${mn?` style="background:rgba(244,54,79,${a});color:${a>.55?'#fff':'inherit'}"`:''}>${i}</b>`}
const l=h.filter(x=>inM(x,pre));
o+=nav(`Tháng ${hm+1}/${hy}`)+`<div class="cal">${c}</div><p>${l.length} buổi · ${new Set(l.map(x=>dk(x.t))).size} ngày tập · ${Math.round(sum(l)/60)} phút. Bấm vào ngày để xem chi tiết.</p>`;
}else{
const ms=Array.from({length:12},(_,i)=>h.filter(x=>inM(x,hy+'-'+p2(i+1))).reduce((a,x)=>a+x.el,0)/60),mx=Math.max(...ms,1);
o+=nav(`Năm ${hy}`)+`<div class="yr">`+ms.map((v,i)=>`<div data-a="mon" data-m="${i}">${v?Math.round(v):''}<span style="height:${v/mx*80}%"></span>${i+1}</div>`).join('')+`</div><p>Tổng: ${h.filter(x=>inM(x,hy+'-')).length} buổi · ${Math.round(ms.reduce((a,v)=>a+v,0))} phút (phút mỗi tháng). Bấm cột để xem tháng.</p>`;
}
return o+`<hr style="border:0;border-top:1px solid var(--bd)"><button class="btn" data-a="exp">⬇ Xuất sao lưu</button><button class="btn" data-a="imp">⬆ Nhập sao lưu</button><button class="btn" data-a="clr">🗑 Xóa lịch sử</button><p style="color:var(--mu);font-size:13px">Dữ liệu lưu trên thiết bị này. Hãy xuất tệp sao lưu định kỳ để không mất khi xóa dữ liệu trình duyệt.</p>`;
}
const syncYM=()=>{hy=+hdk.slice(0,4);hm=+hdk.slice(5,7)-1};
$('ov').addEventListener('click',e=>{
if(e.target===$('ov')){closeOv();return}
const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,D=b.dataset;
if(a==='close')closeOv();
else if(a==='tab'){mt=D.t;if(mt==='hist'){hdk=dk(Date.now());syncYM()}mrender()}
else if(a==='hv'){hv=D.v;syncYM();mrender()}
else if(a==='nav'){const n=+D.n;
if(hv==='day'){const d=new Date(hdk+'T00:00');d.setDate(d.getDate()+n);hdk=dk(d);syncYM()}
else if(hv==='month'){hm+=n;if(hm<0){hm=11;hy--}if(hm>11){hm=0;hy++}}
else hy+=n;
mrender()}
else if(a==='day'){hdk=D.d;hv='day';mrender()}
else if(a==='mon'){hm=+D.m;hv='month';mrender()}
else if(a==='pre'){const p=allP()[+D.i];Object.assign(cfg,p.c);cfg.names=p.c.names?[...p.c.names]:[];save();render();closeOv()}
else if(a==='pdel'){const l=get('pre');l.splice(+D.i,1);put('pre',l);mrender()}
else if(a==='psave'){const n=prompt('Tên mẫu tập');if(n&&n.trim()){const c={};PK.forEach(k=>c[k]=cfg[k]);c.names=[...(cfg.names||[])];put('pre',[...get('pre'),{n:n.trim(),c}]);mrender()}}
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify({v:1,cfg,hist:get('hist'),pre:get('pre')})],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='time-backup-'+dk(Date.now())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
else if(a==='imp')$('file').click();
else if(a==='clr'){if(confirm('Xóa toàn bộ lịch sử tập luyện? Không thể hoàn tác.')){put('hist',[]);mrender()}}
});
$('file').onchange=e=>{
const f=e.target.files[0];e.target.value='';if(!f)return;
const r=new FileReader();
r.onload=()=>{try{
const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;
if(Array.isArray(d.hist)){const m=new Map(get('hist').map(x=>[x.t,x]));d.hist.forEach(x=>{if(x&&x.t)m.set(x.t,x)});put('hist',[...m.values()].sort((a,b)=>a.t-b.t))}
if(Array.isArray(d.pre))put('pre',d.pre);
if(d.cfg&&typeof d.cfg==='object'){Object.assign(cfg,d.cfg);save()}
render();mrender();alert('Đã nhập dữ liệu sao lưu.');
}catch(x){alert('Tệp sao lưu không hợp lệ.')}};
r.readAsText(f);
};
$('menu').onclick=openMenu;
if('speechSynthesis' in window)speechSynthesis.getVoices();
render();
let hw=0;try{hw=+localStorage.getItem('hideWel')||0}catch(e){}
const hwD=new Date(hw),nwD=new Date();
if(!hw||nwD.getFullYear()*12+nwD.getMonth()>hwD.getFullYear()*12+hwD.getMonth())welcome();
</script>
</body>
</html>
