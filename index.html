<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Đồng hồ bấm giờ</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bấm giờ">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4364f">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<div class="top" id="top">
<h1>Đồng hồ bấm giờ</h1>
<button id="menu" aria-label="Lịch sử, mẫu tập và hướng dẫn"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="2.4" rx="1.2"/><rect x="4" y="10.8" width="16" height="2.4" rx="1.2"/><rect x="4" y="15.6" width="16" height="2.4" rx="1.2"/></svg></button>
<div id="label">Tổng thời gian</div>
<div id="time">00:00</div>
<div id="info"></div>
<div id="wk"></div>
<div id="prog"></div>
</div>
<div class="sheet" id="sheet">
<button id="play" aria-label="Bắt đầu"><svg viewBox="0 0 24 24" id="pi"><path d="M7 4l14 8-14 8z"/></svg></button>
<div class="tools">
<button id="voice"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6M17.8 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Âm thanh</span></button><button id="vsel"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.8 11.5a6.2 6.2 0 0 0 12.4 0M12 17.8V21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Giọng đọc</span></button><button id="theme"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18z"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Giao diện</span></button><button id="names"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.3V20h2.7L18 8.7 15.3 6z"/><path d="M19.7 7a1 1 0 0 0 0-1.4l-1.3-1.3a1 1 0 0 0-1.4 0L16 5.3 18.7 8z"/></svg> Tên bài</span><small>Tùy chỉnh</small></button>
</div>
<div id="sug"></div>
<div id="rows"></div>
</div>
</div>
<div id="run">
<button id="lockBtn" aria-label="Khóa màn hình"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.6"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="rCancel" aria-label="Hủy buổi tập"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
<div id="rTitle">Tập luyện</div>
<div class="pan">Bài tập<div class="dots" id="rEx"></div></div>
<div class="pan">Vòng tập<div class="dots" id="rSet"></div></div>
<div class="ringw">
<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/>
<circle id="ring" cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="0"/></svg>
<div class="mid"><div id="rPhase"></div><div id="rTime">00:00</div>
<div id="rTotal"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="15" cy="15" r="12"/><path d="M15 8v8h5"/></svg><span id="rLeft">00:00</span><small>còn lại</small></div></div>
</div>
<div id="rName"></div><div id="rSub"></div>
<div class="ctl">
<button id="rPrev" aria-label="Quay lại"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M18 5L8 12l10 7z"/><path d="M5 5v14"/></svg></button>
<button id="rPlay"><svg viewBox="0 0 24 24" id="rpi"><path d="M7 4l14 8-14 8z"/></svg></button>
<button id="rSkip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"/><path d="M19 5v14"/></svg></button></div>
</div>
<div id="done">
<canvas id="cf"></canvas>
<div class="medal"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 33l12 12 21-24"/></svg></div>
<h2>HOÀN THÀNH!</h2>
<p>Tuyệt vời, bạn đã hoàn thành buổi tập</p>
<div id="dStats"></div>
<button id="dDone">XONG</button>
<button id="dShare">Chia sẻ bản sao lưu</button>
</div>
<div id="lk"><button id="lkHold" aria-label="Chạm để mở khóa"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.6"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="lkHint">Đang khoá cảm ứng. Chạm vào nút khóa để mở.</div></div>
<div class="ov" id="ov"><div class="box">
<div class="mh"><span id="mtl"></span><button data-a="close" aria-label="Đóng">✕</button></div>
<div class="tabs" id="mt"></div><div id="mb"></div>
</div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script src="assets/img-curlup.js"></script>
<script src="assets/img-sideplank.js"></script>
<script src="assets/img-birddog.js"></script>
<script src="app.js"></script>
</body>
</html>
