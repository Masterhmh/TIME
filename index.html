<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Đồng hồ bấm giờ</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bấm giờ">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4364f">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
:root{--bg:#fff;--tx:#222;--chip:#eee;--mu:#888;--bd:#e5e5e5}
[data-theme=dark]{--bg:#14161a;--tx:#eee;--chip:#2a2d33;--mu:#9aa;--bd:#33363c}
body{margin:0;font-family:-apple-system,"SF Pro Display",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:480px;min-height:100vh;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--bg)}
.top{position:relative;height:52vh;height:52dvh;min-height:340px;color:#fff;text-align:center;background:linear-gradient(135deg,#ff6b57,#f4364f 55%,#ee1650);transition:background .4s}
.top.rest{background:linear-gradient(135deg,#2dd4bf,#0ea5e9)}
.top.setrest{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.top.switch{background:linear-gradient(135deg,#fbbf24,#f97316)}
h1{margin:0;padding:calc(env(safe-area-inset-top,0px) + 22px) 60px 0;font-size:24px;font-weight:700}
#menu{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:22px;cursor:pointer}
#label{margin-top:34px;font-size:18px;opacity:.9;min-height:24px}
#time{font-size:80px;font-size:clamp(72px,24vw,96px);font-weight:700;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
#info{font-size:16px;opacity:.9;margin-top:6px;min-height:22px}
#prog{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.7);width:0;transition:width .2s}
.sheet{flex:1;background:var(--bg);border-radius:34px 34px 0 0;margin-top:-34px;position:relative;padding:62px 16px calc(30px + env(safe-area-inset-bottom,0px))}
#play{position:absolute;top:-45px;left:50%;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:7px solid #f2284f;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 12px var(--bg);padding:0}
#play svg{width:38px;height:38px;fill:#f2284f}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.tools button{border:0;background:var(--chip);border-radius:14px;padding:8px 4px;min-height:52px;font-size:13.5px;font-weight:600;line-height:1.25;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tools small{display:block;font-size:11.5px;font-weight:400;color:var(--mu);margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;border-radius:20px;padding:8px 12px 8px 16px;min-height:68px;margin-bottom:10px;font-size:18px;font-weight:600}
.row .ic{width:28px;height:28px;margin-right:12px;flex:none}
.row .n{flex:1;min-width:0;cursor:pointer;color:var(--tx);line-height:1.2}
.row .n small{display:block;font-size:12px;font-weight:400;line-height:1.25;color:var(--mu);margin-top:2px}
.row .v{font-size:26px;font-weight:600;min-width:62px;text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.row button{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.8);font-size:22px;font-weight:700;margin-left:2px;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.row button.sw{width:60px;height:34px;border-radius:17px;background:rgba(0,0,0,.18);position:relative;margin:0 6px 0 8px;padding:0;transition:background .2s}
.row button.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.row button.sw.on{background:currentColor}
.row button.sw.on::after{transform:translateX(26px)}
[data-theme=dark] .row button.sw{background:rgba(255,255,255,.25)}
[data-theme=dark] .row button.sw.on{background:currentColor}
@media (prefers-reduced-motion:reduce){.row button.sw,.row button.sw::after{transition:none}}
.r1{background:#e6f9f0;color:#15803d}.r2{background:#fde1e6;color:#d81b45}
.r3{background:#f3f3f3;color:#5f5f5f}.r4{background:#e8eafd;color:#4350d8}
.r5{background:#f1e9fc;color:#7c3aed}.r6{background:#fdf6e3;color:#a16207}
[data-theme=dark] .r1{background:#12301f}[data-theme=dark] .r2{background:#3a1520}[data-theme=dark] .r3{background:#2a2a2a}
[data-theme=dark] .r4{background:#1b1f45}[data-theme=dark] .r5{background:#2a1c47}[data-theme=dark] .r6{background:#3a3115}
[data-theme=dark] .row button{background:rgba(255,255,255,.15)}
[data-theme=dark] .r1{color:#4ade80}[data-theme=dark] .r2{color:#ff7b95}[data-theme=dark] .r3{color:#c4c4c4}
[data-theme=dark] .r4{color:#9aa5ff}[data-theme=dark] .r5{color:#b9a0ff}[data-theme=dark] .r6{color:#f0cc55}
#run{display:none;position:fixed;inset:0;z-index:9;flex-direction:column;align-items:center;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto;transition:background .4s}
#rTitle{font-size:22px;font-weight:700;height:44px;margin:-4px 0 clamp(8px,2dvh,16px);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 52px;white-space:nowrap}
.pan{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;border:2px solid rgba(255,255,255,.25);border-radius:26px;padding:0 20px;height:56px;height:clamp(48px,7dvh,56px);flex:none;margin-bottom:10px;font-size:20px;font-weight:600}
.dots{display:flex;gap:12px;align-items:center}.dots i{font-style:normal;font-size:22px;font-weight:600;min-width:20px;text-align:center;color:#fff;opacity:.35;transition:opacity .3s,transform .3s}.dots i.on{opacity:1;font-weight:800;transform:scale(1.2)}
.ringw{position:relative;flex:none;width:min(80vw,380px);width:clamp(180px,min(80vw,380px,calc(100dvh - 505px)),380px);aspect-ratio:1;margin:auto;container-type:inline-size}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#rPhase{font-size:22px;font-weight:600;text-transform:uppercase}
#rTime{font-size:64px;font-size:clamp(44px,22cqw,84px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#rTotal{font-size:24px;font-weight:600;display:flex;align-items:center;gap:8px}#rTotal small{font-size:13px;font-weight:400;opacity:.8}
#rName{font-size:30px;font-size:clamp(26px,4.6dvh,38px);font-weight:800;text-transform:uppercase;text-align:center;overflow-wrap:anywhere;padding:0 8px}
#rSub{opacity:.85;margin:10px 0 clamp(14px,3dvh,28px);min-height:20px;text-align:center}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px}
.ctl .c{background:none;border:0;color:#fff;font-size:18px;width:70px;cursor:pointer;text-align:left}
#rPlay{width:104px;height:104px;width:clamp(84px,13dvh,116px);height:clamp(84px,13dvh,116px);border-radius:50%;border:0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#rPlay svg{width:46px;height:46px;fill:currentColor}
#rSkip{width:70px;height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.25);cursor:pointer;display:flex;align-items:center;justify-content:center}
#done{display:none;position:fixed;inset:0;z-index:20;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;
background:radial-gradient(circle at 50% 35%,#34d399,#0ea5e9 70%,#6366f1);animation:dfade .5s ease both}
#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.medal{width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;
position:relative;animation:dpop .7s cubic-bezier(.2,1.6,.4,1) .15s both}
.medal::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(255,255,255,.5);animation:dpulse 1.8s ease-out .8s infinite}
.medal svg{width:84px;height:84px}
.medal path{stroke-dasharray:60;stroke-dashoffset:60;animation:dcheck .6s ease .75s forwards}
#done h2{font-size:36px;font-weight:800;margin:28px 0 8px;letter-spacing:.5px;animation:dup .6s ease .5s both}
#done p{margin:0;font-size:18px;opacity:.95;animation:dup .6s ease .7s both}
#dStats{display:flex;gap:12px;margin:26px 0 34px;animation:dup .6s ease .9s both}
#dStats div{background:rgba(255,255,255,.2);border-radius:18px;padding:12px 18px;min-width:84px}
#dStats b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
#dStats span{font-size:13px;opacity:.9}
#dDone{border:0;border-radius:30px;background:#fff;color:#0ea5e9;font-size:18px;font-weight:700;padding:16px 56px;cursor:pointer;animation:dup .6s ease 1.1s both;position:relative}
@keyframes dfade{from{opacity:0}to{opacity:1}}
@keyframes dpop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes dcheck{to{stroke-dashoffset:0}}
@keyframes dpulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes dup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#done,#done *,.medal::before{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.ctl{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;justify-items:center}.ctl .c{width:auto;justify-self:start}#rPrev,#rSkip{width:64px;height:64px}#rPrev{border-radius:50%;border:0;background:rgba(255,255,255,.25);cursor:pointer;display:flex;align-items:center;justify-content:center}
#wk{font-size:14px;opacity:.9;margin-top:4px;min-height:20px}
.sug{background:var(--chip);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.4}.sug b{display:block;margin-bottom:2px}.sug .btn{margin:8px 8px 0 0}
#lockBtn{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:20px;cursor:pointer;padding:0}
#lk{display:none;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.12);color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#lkHold{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;padding:0;touch-action:none;font-size:20px}
#lkHint{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 66px);padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.55);font-size:13px;line-height:1.3;max-width:70vw;opacity:0;pointer-events:none}
#lkHint.show{animation:lkToast 3s ease forwards}
@keyframes lkToast{0%{opacity:0;transform:translateY(-4px)}10%,75%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#lkHint.show{animation:none;opacity:1}}
.fi{width:1.15em;height:1.15em;vertical-align:-.22em;fill:currentColor;flex:none}
.row .ic .g{fill:var(--bg)}.row .ic .s{fill:none;stroke:var(--bg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#menu .fi,#lockBtn .fi,#lkHold>.fi{width:22px;height:22px;vertical-align:middle}
/* Popup / menu */
.ov{display:none;overscroll-behavior:contain;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
.box{background:var(--bg);color:var(--tx);width:100%;max-width:480px;height:84vh;height:84dvh;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 20px);border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .24s ease-out}
.box::before{content:"";flex:none;width:40px;height:5px;border-radius:3px;background:var(--bd);margin:9px auto 0}
.box.sm{height:auto}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
.mh{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 18px 10px;font-size:22px;font-weight:700}
.mh button{border:0;background:var(--chip);color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer}
.tabs{flex:none;display:flex;flex-wrap:nowrap;gap:4px;padding:0 12px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs .tb{flex:1 0 auto;text-align:center;padding:10px 7px;font-size:13.5px;font-weight:600}
.tb,.btn{border:0;background:var(--chip);color:var(--tx);border-radius:12px;padding:9px 13px;min-height:38px;font-size:14px;cursor:pointer;white-space:nowrap}
.tb.on,.btn.p{background:#f2284f;color:#fff}
.btn{margin:6px 6px 0 0}
#mb{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 18px 22px;font-size:15px;line-height:1.55}
html.lock,html.lock body{overflow:hidden}
#mb a{color:#f2284f;font-weight:600;text-decoration:none}#mb p{margin:10px 0}#mb ul{padding-left:20px;margin:6px 0}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px}
.st div{background:var(--chip);border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;color:var(--mu)}
.st b{display:block;font-size:19px;color:var(--tx)}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:600}
.nav .btn{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal i{font-style:normal;color:var(--mu);font-size:11px}
.cal b{font-weight:500;padding:9px 0;border-radius:10px;cursor:pointer;background:var(--chip)}
.cal b.n{visibility:hidden}.cal b.t{outline:2px solid #f2284f}
.yr{display:flex;align-items:flex-end;gap:5px;height:160px;margin:8px 0}
.yr div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu);cursor:pointer}
.yr span{width:100%;background:#f2284f;border-radius:6px 6px 0 0;min-height:2px}
.it{border:1px solid var(--bd);border-radius:14px;padding:11px 14px;margin:10px 0}
.it small{display:block;color:var(--mu)}
.it b{font-size:16px}
.ill{display:block;width:100%;max-height:170px;margin:8px auto;color:var(--tx)}
img.ill{max-height:none;height:auto;border-radius:12px}
#rCancel{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
#rCancel .fi{width:20px;height:20px;vertical-align:middle}
.ctl{display:flex;justify-content:center;align-items:center;gap:24px}
</style>
</head>
<body>
<div id="app">
<div class="top" id="top">
<h1>Đồng hồ bấm giờ</h1>
<button id="menu" aria-label="Lịch sử, mẫu tập và hướng dẫn"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="2.4" rx="1.2"/><rect x="4" y="10.8" width="16" height="2.4" rx="1.2"/><rect x="4" y="15.6" width="16" height="2.4" rx="1.2"/></svg></button>
<div id="label">Tổng thời gian</div>
<div id="time">00:00</div>
<div id="info"></div>
<div id="wk"></div>
<div id="prog"></div>
</div>
<div class="sheet" id="sheet">
<button id="play" aria-label="Bắt đầu"><svg viewBox="0 0 24 24" id="pi"><path d="M7 4l14 8-14 8z"/></svg></button>
<div class="tools">
<button id="voice"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6M17.8 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Âm thanh</span></button><button id="vsel"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.8 11.5a6.2 6.2 0 0 0 12.4 0M12 17.8V21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Giọng đọc</span></button><button id="theme"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18z"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Giao diện</span></button><button id="names"><span><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.3V20h2.7L18 8.7 15.3 6z"/><path d="M19.7 7a1 1 0 0 0 0-1.4l-1.3-1.3a1 1 0 0 0-1.4 0L16 5.3 18.7 8z"/></svg> Tên bài</span><small>Tùy chỉnh</small></button>
</div>
<div id="sug"></div>
<div id="rows"></div>
</div>
</div>
<div id="run">
<button id="lockBtn" aria-label="Khóa màn hình"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.6"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="rCancel" aria-label="Hủy buổi tập"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
<div id="rTitle">Tập luyện</div>
<div class="pan">Bài tập<div class="dots" id="rEx"></div></div>
<div class="pan">Vòng tập<div class="dots" id="rSet"></div></div>
<div class="ringw">
<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/>
<circle id="ring" cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="0"/></svg>
<div class="mid"><div id="rPhase"></div><div id="rTime">00:00</div>
<div id="rTotal"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="15" cy="15" r="12"/><path d="M15 8v8h5"/></svg><span id="rLeft">00:00</span><small>còn lại</small></div></div>
</div>
<div id="rName"></div><div id="rSub"></div>
<div class="ctl">
<button id="rPrev" aria-label="Quay lại"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M18 5L8 12l10 7z"/><path d="M5 5v14"/></svg></button>
<button id="rPlay"><svg viewBox="0 0 24 24" id="rpi"><path d="M7 4l14 8-14 8z"/></svg></button>
<button id="rSkip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"/><path d="M19 5v14"/></svg></button></div>
</div>
<div id="done">
<canvas id="cf"></canvas>
<div class="medal"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 33l12 12 21-24"/></svg></div>
<h2>HOÀN THÀNH!</h2>
<p>Tuyệt vời, bạn đã hoàn thành buổi tập</p>
<div id="dStats"></div>
<button id="dDone">XONG</button>
</div>

<script>
const $=id=>document.getElementById(id);
const DEF={prep:5,hold:10,rest:3,ex:3,nSets:3,first:5,dec:2,setRest:15,switchRest:30,swap:1,sideRest:10,goal:5,vol:100,voice:'',autolock:0,snd:'beep',theme:'auto',names:['Curl-Up','Side Plank','Bird-Dog']};
let cfg={...DEF};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cfg')||'{}'))}catch(e){}
const getSets=(c=cfg)=>Array.from({length:c.nSets},(_,i)=>Math.max(1,c.first-c.dec*i));
const save=()=>{try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const p2=n=>String(n).padStart(2,'0');
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BIG3=['Curl-Up','Side Plank','Bird-Dog'];
const nameOf=e=>((cfg.names||[])[e-1]||'').trim()||BIG3[e-1]||'Bài tập '+e;
const ICONS={
play:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><path class="g" d="M12.5 9.5v13l10.5-6.5z"/></svg>',
pause:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><rect class="g" x="10.5" y="9.5" width="4" height="13" rx="1.4"/><rect class="g" x="17.5" y="9.5" width="4" height="13" rx="1.4"/></svg>',
bolt:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><path class="g" d="M17.8 6.5L10 17.6h5.2L13.8 25.5 22 14.2h-5.3z"/></svg>',
loop:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><path class="s" d="M22.2 16a6.2 6.2 0 1 1-1.9-4.4"/><path class="s" d="M22.6 8.4v4.6H18"/></svg>',
clock:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><circle class="s" cx="16" cy="16" r="7.6"/><path class="s" d="M16 11.8V16l3 1.8"/></svg>',
spk:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><path class="g" d="M9.5 13v6h4l5 4.5v-15L13.5 13z"/><path class="s" d="M21.5 12.5a5 5 0 0 1 0 7"/></svg>',
target:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><circle class="s" cx="16" cy="16" r="7.4"/><circle class="g" cx="16" cy="16" r="2.6"/></svg>',
lockr:'<svg class="ic" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><rect class="g" x="9.5" y="14" width="13" height="9.5" rx="2.4"/><path class="s" d="M12.5 14v-2.4a3.5 3.5 0 0 1 7 0V14"/></svg>'
};
const FI={"sound": "<path d=\"M4 9.5v5h3.5l4.5 4v-13l-4.5 4z\"/><path d=\"M15.2 9.2a4 4 0 0 1 0 5.6M17.8 6.6a7.6 7.6 0 0 1 0 10.8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "mic": "<rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5.8 11.5a6.2 6.2 0 0 0 12.4 0M12 17.8V21\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "theme": "<path d=\"M12 3a9 9 0 0 0 0 18z\"/><circle cx=\"12\" cy=\"12\" r=\"8.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "edit": "<path d=\"M4 17.3V20h2.7L18 8.7 15.3 6z\"/><path d=\"M19.7 7a1 1 0 0 0 0-1.4l-1.3-1.3a1 1 0 0 0-1.4 0L16 5.3 18.7 8z\"/>", "lock": "<rect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2.6\"/><path d=\"M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "menu": "<rect x=\"4\" y=\"6\" width=\"16\" height=\"2.4\" rx=\"1.2\"/><rect x=\"4\" y=\"10.8\" width=\"16\" height=\"2.4\" rx=\"1.2\"/><rect x=\"4\" y=\"15.6\" width=\"16\" height=\"2.4\" rx=\"1.2\"/>", "trash": "<path d=\"M8.2 3.8h7.6l.7 1.7H20V8H4V5.5h3.5z\"/><path d=\"M6 9.5h12l-.8 9.8a1.6 1.6 0 0 1-1.6 1.5H8.4a1.6 1.6 0 0 1-1.6-1.5z\"/>", "down": "<path d=\"M10.8 3.5h2.4v8l2.8-2.8 1.7 1.7L12 15.9 6.3 10.4 8 8.7l2.8 2.8z\"/><rect x=\"5\" y=\"18\" width=\"14\" height=\"2.4\" rx=\"1.2\"/>", "up": "<path d=\"M10.8 16h2.4V8l2.8 2.8 1.7-1.7L12 3.6 6.3 9.1 8 10.8 10.8 8z\"/><rect x=\"5\" y=\"18\" width=\"14\" height=\"2.4\" rx=\"1.2\"/>", "bulb": "<path d=\"M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.1 1 1.9V17h5v-1.2c0-.8.4-1.4 1-1.9A6 6 0 0 0 12 3z\"/><rect x=\"9.5\" y=\"18.3\" width=\"5\" height=\"2.3\" rx=\"1.15\"/>", "check": "<path fill-rule=\"evenodd\" d=\"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm4.3 6.7-5.1 5.6-2.6-2.5 1.2-1.3 1.3 1.2 3.9-4.2z\"/>", "pausei": "<path fill-rule=\"evenodd\" d=\"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 8.5h2v7h-2zm3 0h2v7h-2z\"/>"};
const I=n=>`<svg class="fi" viewBox="0 0 24 24" aria-hidden="true">${FI[n]}</svg>`;
const ROWS=[
{k:'prep',cls:'r6',ic:'clock',name:'Chuẩn bị',sub:'Giây trước khi bắt đầu (0 = tắt)',step:1,min:0,fmt:fmt},
{k:'hold',cls:'r1',ic:'play',name:'Tập luyện',sub:'Giữ mỗi cái (giây)',step:1,min:1,fmt:fmt},
{k:'rest',cls:'r2',ic:'pause',name:'Nghỉ ngơi',sub:'Nghỉ giữa các cái (giây)',step:1,min:0,fmt:fmt},
{k:'ex',cls:'r3',ic:'bolt',name:'Bài tập',sub:'Số bài',step:1,min:1,fmt:v=>v},
{k:'swap',cls:'r5',ic:'loop',name:'Đổi chân / đổi bên',sub:'Bật: mỗi hiệp làm bên trái rồi bên phải',step:1,min:0,max:1,fmt:v=>v?'Bật':'Tắt'},
{k:'sideRest',cls:'r5',ic:'clock',name:'Nghỉ đổi bên',sub:'Giây (giữa trái và phải)',step:1,min:0,fmt:fmt,need:'swap'},
{k:'nSets',cls:'r4',ic:'loop',name:'Số hiệp',sub:'Số hiệp mỗi bài',step:1,min:1,fmt:v=>v},
{k:'first',cls:'r4',ic:'loop',name:'Số cái ở hiệp đầu',sub:'Hiệp đầu tiên có bao nhiêu cái',step:1,min:1,fmt:v=>v},
{k:'dec',cls:'r4',ic:'loop',name:'Giảm mỗi hiệp',sub:'0 = giữ nguyên các hiệp',step:1,min:0,fmt:v=>v},
{k:'setRest',cls:'r5',ic:'clock',name:'Nghỉ giữa hiệp',sub:'Giây',step:1,min:0,fmt:fmt},
{k:'switchRest',cls:'r6',ic:'clock',name:'Nghỉ chuyển bài',sub:'Giây',step:1,min:0,fmt:fmt},
{k:'goal',cls:'r3',ic:'target',name:'Mục tiêu tuần',sub:'Số buổi hoàn thành mỗi tuần (0 = tắt)',step:1,min:0,max:21,fmt:v=>v?v+' buổi':'Tắt'},
{k:'vol',cls:'r1',ic:'spk',name:'Âm lượng',sub:'Âm báo và giọng nói',step:10,min:0,max:100,fmt:v=>v+'%'}
];
const SND=[['beep','Âm báo'],['voice','Giọng nói'],['both','Âm báo + giọng nói'],['off','Tắt']];
const SNDS={beep:'Âm báo',voice:'Giọng nói',both:'Báo + nói',off:'Tắt'};
const THM=[['auto','Tự động'],['light','Sáng'],['dark','Tối']];
function applyTheme(){const d=cfg.theme==='dark'||(cfg.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}
function render(){
$('rows').innerHTML=ROWS.filter(r=>!r.need||cfg[r.need]).map(r=>{
const v=cfg[r.k];
return `<div class="row ${r.cls}">${ICONS[r.ic]}<div class="n" data-k="${r.k}">${r.name}<small>${r.sub}</small></div>`+
(r.max===1?`<button class="sw${v?' on':''}" role="switch" aria-checked="${v?'true':'false'}" aria-label="${r.name}" data-k="${r.k}"></button></div>`:
`<button data-k="${r.k}" data-d="-1">−</button><div class="v" data-k="${r.k}">${r.fmt(v)}</div><button data-k="${r.k}" data-d="1">+</button></div>`);
}).join('');
$('voice').innerHTML='<span>'+I('sound')+' Âm thanh</span><small>'+SNDS[cfg.snd]+'</small>';
$('vsel').innerHTML='<span>'+I('mic')+' Giọng đọc</span><small>'+vname()+'</small>';
$('theme').innerHTML='<span>'+I('theme')+' Giao diện</span><small>'+THM.find(x=>x[0]===cfg.theme)[1]+'</small>';
applyTheme();
if(!running&&!started)showTotal();
}
$('rows').addEventListener('click',e=>{
if(started)return;
const k=e.target.dataset.k;if(!k)return;
const r=ROWS.find(x=>x.k===k);
if(r.max===1&&!e.target.dataset.d){cfg[k]=cfg[k]?0:1;save();render();return}
if(e.target.dataset.d){
cfg[k]=Math.min(r.max||1e4,Math.max(r.min,cfg[k]+r.step*e.target.dataset.d));
save();render();return;
}
const s=prompt(r.name+' ('+r.sub+')',cfg[k]);
if(s!==null&&!isNaN(+s)){
cfg[k]=Math.min(r.max||1e4,Math.max(r.min,Math.round(+s)));
save();render();
}
});
$('voice').onclick=()=>{const i=SND.findIndex(x=>x[0]===cfg.snd);cfg.snd=SND[(i+1)%SND.length][0];if('speechSynthesis' in window)speechSynthesis.cancel();save();render()};
$('theme').onclick=()=>{const i=THM.findIndex(x=>x[0]===cfg.theme);cfg.theme=THM[(i+1)%3][0];save();render()};
$('names').onclick=()=>{const n=[...(cfg.names||[])];for(let i=1;i<=cfg.ex;i++){const s=prompt('Tên bài '+i+' (để trống = tên mặc định)',n[i-1]||nameOf(i));if(s===null)break;n[i-1]=s.trim()}cfg.names=n;save();render()};
/* Timeline */
function build(){
const st=[],S=getSets(),sides=cfg.swap?2:1;
if(cfg.prep>0)st.push({t:'prep',d:cfg.prep,e:1,s:1,label:'Chuẩn bị'});
for(let e=1;e<=cfg.ex;e++){
S.forEach((n,si)=>{
for(let sd=1;sd<=sides;sd++){
for(let r=1;r<=n;r++){
st.push({t:'hold',d:cfg.hold,e,s:si+1,r,n,sd,label:'Giữ'});
if(r<n&&cfg.rest>0)st.push({t:'rest',d:cfg.rest,e,s:si+1,r,n,sd,label:'Nghỉ'});
}
if(sd<sides&&cfg.sideRest>0)st.push({t:'side',d:cfg.sideRest,e,s:si+1,sd,label:'Đổi bên',say:`Xong bên trái. Nghỉ ${cfg.sideRest} giây, đổi sang bên phải`});
}
if(si<S.length-1&&cfg.setRest>0)st.push({t:'setrest',d:cfg.setRest,e,s:si+1,label:'Nghỉ giữa hiệp',say:`Xong hiệp ${si+1}. Nghỉ ${cfg.setRest} giây. Hiệp tiếp theo ${S[si+1]} cái${cfg.swap?' mỗi bên, bắt đầu bên trái':''}`});
});
if(e<cfg.ex&&cfg.switchRest>0)st.push({t:'switch',d:cfg.switchRest,e,label:'Chuyển bài',say:`Xong ${nameOf(e)}. Nghỉ ${cfg.switchRest} giây, chuyển sang ${nameOf(e+1)}`});
}
return st;
}
let sessStart=0,steps=[],idx=0,rem=0,running=false,started=false,last=0,lastSec=-1,totalAll=0,doneTime=0,halfSaid=false,wl=null;
const COL={prep:['#a78bfa','#7c3aed'],hold:['#5de3a1','#4ecb8f'],rest:['#ff6b57','#ee1650'],setrest:['#8b8bf5','#5b6cf0'],switch:['#fbbf24','#f97316'],side:['#fbbf24','#f97316']};
const TITLE={prep:'Chuẩn bị',hold:'Tập luyện',rest:'Nghỉ ngơi',setrest:'Nghỉ giữa hiệp',switch:'Chuyển bài',side:'Đổi bên'};
const SIDE=['','Bên trái','Bên phải'];
function showTotal(){
const tot=build().reduce((a,s)=>a+s.d,0);
$('time').textContent=fmt(tot);$('label').textContent='Tổng thời gian';
$('top').className='top';$('info').textContent=cfg.ex+' bài × '+cfg.nSets+' hiệp ('+getSets().join('·')+')'+(cfg.swap?' · 2 bên':'');
week();sugRender();
}
function week(){const d=new Date(),ws=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+6)%7).getTime(),n=get('hist').filter(x=>x.ok&&x.t>=ws).length,g=cfg.goal;
$('wk').textContent=g?`Tuần này: ${n}/${g} buổi${n>=g?' · Đạt mục tiêu':''}`:'';$('prog').style.width=g?Math.min(100,n/g*100)+'%':'0'}
const wk0=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return dk(x)};
const addD=(k,n)=>{const d=new Date(k+'T00:00');d.setDate(d.getDate()+n);return dk(d)};
const fd=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1);
const vname=()=>{try{return (speechSynthesis.getVoices().find(v=>v.voiceURI===cfg.voice)||{}).name||'Tự động'}catch(e){return 'Tự động'}};
function suggest(){
if(cfg.hold>=30)return null;
let until=0;try{until=+localStorage.getItem('sugOff')||0}catch(e){}
if(Date.now()<until)return null;
const need=Math.max(1,Math.min(cfg.goal||3,3)),cnt={};
get('hist').filter(x=>x.ok&&x.hd>=cfg.hold).forEach(x=>{const k=wk0(new Date(x.t));cnt[k]=(cnt[k]||0)+1});
const cur=wk0(new Date());let k=(cnt[cur]||0)>=need?cur:addD(cur,-7);
for(let i=0;i<3;i++,k=addD(k,-7))if((cnt[k]||0)<need)return null;
return{to:Math.min(30,cfg.hold+2),need};
}
function sugRender(){
const g=suggest(),e=$('sug');
if(!g||started){e.innerHTML='';return}
e.innerHTML=`<div class="sug"><b>${I('bulb')} Gợi ý tăng dần</b>Bạn đã tập đều 3 tuần liên tiếp (từ ${g.need} buổi/tuần) ở mức giữ ${cfg.hold} giây. Có thể thử tăng lên ${g.to} giây. Nếu thấy đau hoặc mỏi bất thường thì giữ nguyên và hỏi chuyên gia.<div><button class="btn p" data-s="ok">Tăng lên ${g.to} giây</button><button class="btn" data-s="later">Để sau 1 tuần</button></div></div>`;
}
/* Âm thanh */
let ac=null;
function initAudio(){
try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(e){}
try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}
}
function beep(f=880,d=.15,v=.35){
v*=cfg.vol/100;if(!ac||!(cfg.snd==='beep'||cfg.snd==='both'))return;
const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
o.frequency.value=f;o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
o.start(t);o.stop(t+d+.02);
}
function say(t,force,uri){
if(!(force||cfg.snd==='voice'||cfg.snd==='both')||!t||!('speechSynthesis' in window))return;
const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=1.05;u.volume=cfg.vol/100;
const vs=speechSynthesis.getVoices(),want=uri!==undefined?uri:cfg.voice,v=(want&&vs.find(x=>x.voiceURI===want))||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('vi'));if(v){u.voice=v;u.lang=v.lang}
speechSynthesis.cancel();speechSynthesis.speak(u);
}
function cueStart(s){
if(s.t==='hold'){beep(1000,.35);say(cfg.swap&&s.sd&&s.r===1?SIDE[s.sd]+', bắt đầu':'Bắt đầu')}
else if(s.t==='prep'){beep(600,.15);say('Chuẩn bị')}
else if(s.t==='rest'){beep(500,.25);say('Nghỉ')}
else{beep(500,.25);say(s.say)}
}
const saveSess=()=>{try{localStorage.setItem('sess',JSON.stringify({idx,rem,doneTime,sessStart,t:Date.now()}))}catch(e){}};
const clearSess=()=>{try{localStorage.removeItem('sess')}catch(e){}};
function resume(){
let d=null;try{d=JSON.parse(localStorage.getItem('sess')||'null')}catch(e){}
if(!d||Date.now()-d.t>6*36e5){clearSess();return false}
steps=build();
if(!steps.length||d.idx>=steps.length||!confirm('Có buổi tập đang dở. Tiếp tục không?')){clearSess();return false}
totalAll=steps.reduce((a,x)=>a+x.d,0);doneTime=d.doneTime;sessStart=d.sessStart;started=true;running=false;
$('run').style.display='flex';enter(d.idx,true);rem=d.rem;upd();setIcon();saveSess();return true}
const dots=(el,n,c)=>{el.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i+1===c?'on':''}">${i+1}</i>`).join('')};
function enter(i,q){
idx=i;const s=steps[i];rem=s.d;lastSec=-1;halfSaid=false;
const c=COL[s.t];
$('run').style.background=`linear-gradient(135deg,${c[0]},${c[1]})`;$('rPlay').style.color=c[1];
$('rPhase').textContent=TITLE[s.t];
const ex=s.t==='switch'?s.e+1:s.e,st=s.t==='switch'?1:s.t==='setrest'?s.s+1:s.s,sl=cfg.swap&&s.sd?' · '+SIDE[s.sd]:'';
const S=getSets();
$('rTitle').textContent=`Bài ${ex}/${cfg.ex} · Hiệp ${st}/${S.length}`;
dots($('rEx'),cfg.ex,ex);dots($('rSet'),S.length,st);$('rName').textContent=nameOf(ex);
$('rSub').textContent=s.t==='prep'?'Sẵn sàng nào':s.t==='hold'?`Cái ${s.r}/${s.n}${sl}`:s.t==='rest'?`Cái tiếp theo: ${s.r+1}/${s.n}${sl}`:s.t==='side'?`Tiếp theo: ${SIDE[2].toLowerCase()}`:`Hiệp ${st}: ${S[st-1]} cái${s.t==='setrest'&&cfg.swap?' mỗi bên · '+SIDE[1]:sl}`;
upd();
if(!q)cueStart(s);
saveSess();
}
function upd(){
const s=steps[idx],r=Math.max(rem,0);
$('rTime').textContent=fmt(r);
$('ring').style.strokeDashoffset=578.05*(1-r/s.d);$('rLeft').textContent=fmt(totalAll-doneTime-(s.d-r));
}
function tick(now){
if(!running)return;
rem-=(now-last)/1000;last=now;
const s=steps[idx],sec=Math.ceil(rem);
if(s.t==='hold'){
if(!halfSaid&&rem<=s.d/2){halfSaid=true;if(s.d>=4){beep(800,.1);say('Một nửa')}}
}else if(s.d>3&&sec!==lastSec&&sec>=1&&sec<=3){beep(700,.1);say(String(sec))}
if(sec!==lastSec)saveSess();
lastSec=sec;
if(rem<=0){
while(rem<=0){const c=steps[idx];doneTime+=c.d;if(idx+1>=steps.length){finish();return}const ov=-rem;enter(idx+1,ov>=steps[idx+1].d);rem-=ov}
}else upd();
requestAnimationFrame(tick);
}

async function wake(on){try{if(on){if(!wl||wl.released)wl=await navigator.wakeLock.request('screen')}else if(wl){wl.release();wl=null}}catch(e){}}

let cfRaf=0;
function confetti(){
cancelAnimationFrame(cfRaf);
const cv=$('cf'),x=cv.getContext('2d'),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const cols=['#ff6b57','#fbbf24','#ffffff','#a78bfa','#f472b6','#facc15'],P=[],R=(a,b)=>a+Math.random()*(b-a);
const mk=(px,py,vx,vy,i)=>P.push({x:px,y:py,vx,vy,w:R(6,11),h:R(8,16),r:R(0,6.28),vr:R(-.3,.3),c:cols[i%cols.length]});
const shoot=(px,dir,n)=>{for(let i=0;i<n;i++)mk(px,H,dir*R(2,9),-R(12,20),i)};
const t0=performance.now();let fired=false;
shoot(0,1,70);shoot(W,-1,70);
(function f(t){
const el=t-t0;
if(el>900&&!fired){fired=true;shoot(0,1,50);shoot(W,-1,50)}
if(el<2500&&Math.random()<.5)mk(R(0,W),-10,R(-1.5,1.5),R(2,5),P.length);
x.clearRect(0,0,W,H);
for(let i=P.length-1;i>=0;i--){
const p=P[i];p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
if(p.y>H+30){P.splice(i,1);continue}
x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();
}
if(P.length||el<2500)cfRaf=requestAnimationFrame(f);else x.clearRect(0,0,W,H);
})(t0);
}

, hai chân chồng lên nhau.</li><li>Nâng hông khỏi sàn để thân thẳng một đường. Tay còn lại đặt trước ngực.</li><li>Làm cả hai bên. Lỗi hay gặp: hông võng, xoay người ra trước hoặc ra sau, nhún vai.</li></ul></div>

 trước ngang vai, cố giữ hông và vai không xoay.</li><li>Giữ, hạ về rồi đổi bên. Lỗi hay gặp: ưỡn lưng, nâng chân tay quá cao, xoay hông.</li></ul></div>
<p style="color:var(--mu);font-size:13px">Hình động minh họa từng bài: nâng lên, giữ, hạ xuống. Vùng đỏ là nhóm cơ đang làm việc, chữ đỏ là điểm cần chú ý. Mỗi vòng gồm nâng lên, giữ (thanh tiến độ ở góc phải), hạ xuống.</p><p>Mẹo trong ứng dụng: cả 3 bài đều nên làm hai bên (Curl-Up thì đổi chân co). Bật “Đổi chân / đổi bên” để ứng dụng tự chạy bên trái rồi bên phải trong từng hiệp. Đặt tên bài tại nút “Tên bài”.</p>
<p style="color:var(--mu);font-size:13px">Thông tin chỉ mang tính tham khảo, không thay thế tư vấn y tế. Nếu đang đau lưng nặng, tê hoặc yếu chân, hãy hỏi bác sĩ hoặc chuyên gia vật lý trị liệu trước khi tập.</p>`;
const vGuide=()=>`<p><b>Cách dùng ứng dụng</b></p><ul><li>Bấm + / − để đổi thông số, bấm vào số để nhập trực tiếp.</li><li>Bấm nút tròn lớn để bắt đầu; trong lúc tập có thể tạm dừng hoặc bỏ qua bước.</li><li>“Tên bài” để đặt tên từng bài; “Mẫu tập” để lưu và dùng lại cấu hình giờ.</li><li>“Đổi chân / đổi bên”: bật thì mỗi hiệp chạy bên trái, nghỉ đổi bên rồi chạy bên phải, sau đó mới nghỉ giữa hiệp; tắt thì chỉ chạy một bên.</li><li>Khi bấm bắt đầu, cảm ứng tự động khóa để khỏi bấm nhầm; muốn mở thì chạm vào nút hình ổ khóa ở góc phải. Có thể khóa lại bằng nút ổ khóa đó.</li><li>“Giọng đọc”: chọn giọng tiếng Việt có sẵn trên máy và nghe thử.</li><li>Buổi tập tự ghi vào Lịch sử khi hoàn thành (hoặc khi hủy giữa chừng nếu đã giữ ít nhất 1 cái).</li></ul><p><b>Nguyên tắc tập luyện</b></p><ul><li>Khởi động 3–5 phút trước khi tập.</li><li>Giữ đúng tư thế, thở đều, không nín thở.</li><li>Tăng dần: thêm vài giây giữ hoặc thêm hiệp mỗi tuần, không tăng đột ngột.</li><li>Nghỉ đủ giữa các hiệp; ngủ đủ để cơ hồi phục.</li><li>Tập đều đặn quan trọng hơn tập quá sức; dùng chuỗi ngày liên tiếp để giữ nhịp.</li><li>Đau nhói, chóng mặt hoặc khó thở: dừng ngay. Nếu có bệnh lý, hỏi bác sĩ trước khi tập.</li></ul>`;

c+=`<b data-a="day" data-d="${k}" class="${k===td?'t':''}"${mn?` style="background:rgba(244,54,79,${a});color:${a>.55?'#fff':'inherit'}"`:''}>${i}</b>`}
const l=h.filter(x=>inM(x,pre));
o+=nav(`Tháng ${hm+1}/${hy}`)+`<div class="cal">${c}</div><p>${l.length} buổi · ${new Set(l.map(x=>dk(x.t))).size} ngày tập · ${Math.round(sum(l)/60)} phút. Bấm vào ngày để xem chi tiết.</p>`;
}else{
const ms=Array.from({length:12},(_,i)=>h.filter(x=>inM(x,hy+'-'+p2(i+1))).reduce((a,x)=>a+x.el,0)/60),mx=Math.max(...ms,1);
o+=nav(`Năm ${hy}`)+`<div class="yr">`+ms.map((v,i)=>`<div data-a="mon" data-m="${i}">${v?Math.round(v):''}<span style="height:${v/mx*80}%"></span>${i+1}</div>`).join('')+`</div><p>Tổng: ${h.filter(x=>inM(x,hy+'-')).length} buổi · ${Math.round(ms.reduce((a,v)=>a+v,0))} phút (phút mỗi tháng). Bấm cột để xem tháng.</p>`;
}
const lab=hv==='day'?'ngày '+hdk.split('-').reverse().join('/'):hv==='week'?'tuần '+fd(new Date(hwk+'T00:00'))+'–'+fd(new Date(addD(hwk,6)+'T00:00')):hv==='month'?`tháng ${hm+1}/${hy}`:`năm ${hy}`;
const del=`<button class="btn" data-a="clr" data-s="${hv}">${I('trash')} Xóa ${lab}</button><button class="btn" data-a="clr" data-s="all">${I('trash')} Xóa tất cả</button>`;
return o+`<hr style="border:0;border-top:1px solid var(--bd)"><button class="btn" data-a="exp">${I('down')} Xuất sao lưu</button><button class="btn" data-a="imp">${I('up')} Nhập sao lưu</button><button class="btn" data-a="csv">${I('down')} Xuất CSV</button><br>${del}<p style="color:var(--mu);font-size:13px">Dữ liệu lưu trên thiết bị này. Hãy xuất tệp sao lưu định kỳ để không mất khi xóa dữ liệu trình duyệt.</p>`;
}
const syncYM=()=>{hy=+hdk.slice(0,4);hm=+hdk.slice(5,7)-1};
$('ov').addEventListener('click',e=>{
if(e.target===$('ov')){closeOv();return}
const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,D=b.dataset;
if(a==='close')closeOv();
else if(a==='tab'){mt=D.t;if(mt==='hist'){hdk=dk(Date.now());hwk=wk0(new Date());syncYM()}mrender()}
else if(a==='hv'){hv=D.v;syncYM();if(hv==='week')hwk=wk0(new Date(hdk+'T00:00'));mrender()}
else if(a==='nav'){const n=+D.n;
if(hv==='day'){const d=new Date(hdk+'T00:00');d.setDate(d.getDate()+n);hdk=dk(d);syncYM()}
else if(hv==='week'){hwk=addD(hwk,7*n)}
else if(hv==='month'){hm+=n;if(hm<0){hm=11;hy--}if(hm>11){hm=0;hy++}}
else hy+=n;
mrender()}
else if(a==='day'){hdk=D.d;hv='day';mrender()}
else if(a==='mon'){hm=+D.m;hv='month';mrender()}
else if(a==='pre'){const p=allP()[+D.i];Object.assign(cfg,p.c);cfg.names=p.c.names?[...p.c.names]:[];save();render();closeOv()}
else if(a==='pdel'){const l=get('pre');l.splice(+D.i,1);put('pre',l);mrender()}
else if(a==='psave'){const n=prompt('Tên mẫu tập');if(n&&n.trim()){const c={};PK.forEach(k=>c[k]=cfg[k]);c.names=[...(cfg.names||[])];put('pre',[...get('pre'),{n:n.trim(),c}]);mrender()}}
else if(a==='vc'){cfg.voice=D.u;save();render();openVoices()}
else if(a==='vt')say('Xin chào, đây là giọng đọc thử',1,D.u)
else if(a==='sdel'){if(confirm('Xóa buổi tập này? Không thể hoàn tác.')){put('hist',get('hist').filter(x=>x.t!==+D.t));mrender()}}
else if(a==='csv'){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',h=get('hist');
const R=[['Ngày','Bắt đầu','Kết thúc','Trạng thái','Số cái','Giây/cái','Thời gian tập (s)','Bài','Hiệp','Đổi bên','Chi tiết bài'],...h.map(x=>[dk(x.t),x.s0?hhmm(x.s0):'',hhmm(x.t),x.ok?'Hoàn thành':'Bỏ dở',x.h,x.hd,x.el,x.ex,x.ns,x.sw?'Có':'Không',x.nl&&x.pe?x.nl.map((n,i)=>n+' '+x.pe[i]).join('; '):(x.nm||'')])];
const u=URL.createObjectURL(new Blob(['\ufeff'+R.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),l=document.createElement('a');l.href=u;l.download='lich-su-'+dk(Date.now())+'.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify({v:1,cfg,hist:get('hist'),pre:get('pre')})],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='time-backup-'+dk(Date.now())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
else if(a==='imp')$('file').click();
else if(a==='clr'){
const sc=D.s,h=get('hist');
let f=()=>true,lab='toàn bộ lịch sử tập luyện';
if(sc==='day'){f=x=>dk(x.t)===hdk;lab='lịch sử ngày '+hdk.split('-').reverse().join('/')}
else if(sc==='week'){const e=addD(hwk,6);f=x=>{const k=dk(x.t);return k>=hwk&&k<=e};lab='lịch sử tuần '+fd(new Date(hwk+'T00:00'))+'–'+fd(new Date(e+'T00:00'))}
else if(sc==='month'){const pre=hy+'-'+p2(hm+1);f=x=>dk(x.t).startsWith(pre);lab=`lịch sử tháng ${hm+1}/${hy}`}
else if(sc==='year'){const pre=hy+'-';f=x=>dk(x.t).startsWith(pre);lab='lịch sử năm '+hy}
const n=h.filter(f).length;
if(!n){alert('Không có buổi tập nào để xóa.');return}
if(confirm(`Xóa ${lab} (${n} buổi tập)? Không thể hoàn tác.`)){put('hist',h.filter(x=>!f(x)));mrender()}
}
});
$('file').onchange=e=>{
const f=e.target.files[0];e.target.value='';if(!f)return;
const r=new FileReader();
r.onload=()=>{try{
const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;
if(Array.isArray(d.hist)){const m=new Map(get('hist').map(x=>[x.t,x]));d.hist.forEach(x=>{if(x&&x.t)m.set(x.t,x)});put('hist',[...m.values()].sort((a,b)=>a.t-b.t))}
if(Array.isArray(d.pre))put('pre',d.pre);
if(d.cfg&&typeof d.cfg==='object'){Object.assign(cfg,d.cfg);save()}
render();mrender();alert('Đã nhập dữ liệu sao lưu.');
}catch(x){alert('Tệp sao lưu không hợp lệ.')}};
r.readAsText(f);
};
function openVoices(){
isWel=false;$('ov').firstElementChild.classList.remove('sm');$('mtl').textContent='Giọng đọc';$('mt').style.display='none';
const vs=speechSynthesis.getVoices(),vi=vs.filter(v=>/^vi/i.test(v.lang)),list=vi.length?vi:vs;
const row=(n,l,u)=>`<div class="it"><b>${esc(n)}</b><small>${esc(l)}</small><button class="btn${cfg.voice===u?' p':''}" data-a="vc" data-u="${esc(u)}">Chọn</button><button class="btn" data-a="vt" data-u="${esc(u)}">Nghe thử</button></div>`;
$('mb').innerHTML=`<p>${vi.length?'Các giọng tiếng Việt trên máy:':'Máy không có giọng tiếng Việt, hiển thị tất cả giọng có sẵn:'}</p>`+row('Tự động','Giọng tiếng Việt đầu tiên tìm thấy','')+list.map(v=>row(v.name,v.lang,v.voiceURI)).join('')+'<p style="color:var(--mu);font-size:13px">Muốn thêm giọng: vào Cài đặt của máy, mục giọng nói/trợ năng để tải giọng tiếng Việt chất lượng cao.</p>';
openOv()}
$('vsel').onclick=()=>{if(!('speechSynthesis' in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}openVoices()};
$('menu').onclick=openMenu;
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(!started)render()}}
render();
let hw=0;try{hw=+localStorage.getItem('hideWel')||0}catch(e){}
const hwD=new Date(hw),nwD=new Date();
if(!resume()&&(!hw||nwD.getFullYear()*12+nwD.getMonth()>hwD.getFullYear()*12+hwD.getMonth()))welcome();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
